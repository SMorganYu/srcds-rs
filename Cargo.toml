[workspace]
resolver = "2"
members = [
    "crates/srcds-protocol",
    "crates/srcds-net",
    "crates/srcds-core",
    "crates/srcds-server",
    "crates/srcds-lua",
    "tools/packet-diff",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.80"

[workspace.dependencies]
srcds-protocol = { path = "crates/srcds-protocol" }
srcds-net = { path = "crates/srcds-net" }
srcds-core = { path = "crates/srcds-core" }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
rand = "0.8"
md-5 = "0.10"
sha2 = "0.10"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
debug = 1
